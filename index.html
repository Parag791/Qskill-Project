<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Manager</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div><p class="tag">WRITE · SHARE · EDIT</p><h1>Simple Blog Manager</h1><p>Create and manage your posts in one place.</p></div></header><main class="layout"><section class="editor"><h2 id="editorTitle">Create a post</h2><form id="postForm"><label for="title">Post title</label><input id="title" maxlength="120" required placeholder="Enter a title"><label for="content">Content</label><textarea id="content" required placeholder="Write your post here..."></textarea><div class="actions"><button id="saveButton">Publish Post</button><button type="button" id="cancelButton" class="secondary" hidden>Cancel Edit</button></div></form><p id="status" role="status"></p></section><section><h2>Published posts</h2><div id="posts" class="posts"></div></section></main><footer>QSkill Internship · Task 3</footer><script src="app.js"></script></body></html>
